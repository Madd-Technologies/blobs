worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  client_max_body_size 5m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr - "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout main;

  # Restore real client IP from Cloudflare Tunnel (edge-net subnet only).
  set_real_ip_from 172.31.0.0/24;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Rate-limiting and connection-limiting zones.
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
  limit_conn_zone $binary_remote_addr zone=ws_ip:10m;
  limit_conn_zone $server_name zone=ws_total:1m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream hermes_backend {
    server hermes-demo:9219;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Proxy healthcheck.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Block ops, plugin/skill installers, MCP mutation, and gateway control routes.
    location ^~ /api/ops/ { return 403; }
    location ^~ /api/skills/hub/ { return 403; }
    location = /api/plugins/install { return 403; }
    location = /api/plugins/remove { return 403; }
    location = /api/plugins/update { return 403; }
    location = /api/gateway/stop { return 403; }
    location = /api/gateway/restart { return 403; }
    location = /api/display/install { return 403; }
    location ^~ /api/mcp/ { return 403; }

    # Strict rate limit on authentication and WebSocket ticket minting.
    location = /login {
      limit_req zone=auth_limit burst=8 nodelay;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /auth/ {
      limit_req zone=auth_limit burst=8 nodelay;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/ws-ticket {
      limit_req zone=auth_limit burst=8 nodelay;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets: gateway RPC (/api/ws) and Bot Screen RFB (/api/display/ws).
    location = /api/ws {
      limit_req zone=api_limit burst=20 nodelay;
      limit_conn ws_ip 10;
      limit_conn ws_total 40;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location = /api/display/ws {
      limit_req zone=api_limit burst=20 nodelay;
      limit_conn ws_ip 10;
      limit_conn ws_total 40;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Standard API endpoints (allow SSE/streaming without buffering).
    location ^~ /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://hermes_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
    }

    # Hide the web SPA from random scanners; mobile clients only hit /api/*, /auth/*, and /login.
    location / {
      return 404;
    }
  }
}
